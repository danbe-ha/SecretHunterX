patterns:

  # ─── GOOGLE / GCP ───────────────────────────────────────────────
  google_api_key:
    pattern: '(AIza[0-9A-Za-z\-_]{35})'
    confidence: high
    service: Google APIs

  google_oauth_client_id:
    pattern: '([0-9]+-[0-9A-Za-z_]{32}\.apps\.googleusercontent\.com)'
    confidence: high
    service: Google OAuth

  google_oauth_client_secret:
    pattern: '(GOCSPX-[A-Za-z0-9_\-]{28})'
    confidence: high
    service: Google OAuth

  google_service_account_key:
    pattern: '"private_key_id"\s*:\s*"([0-9a-f]{40})"'
    confidence: high
    service: Google Service Account

  google_cloud_storage:
    pattern: '(gs://[a-z0-9_\-\.]{3,63}/[^\s"'']+)'
    confidence: medium
    service: Google Cloud Storage

  firebase_url:
    pattern: '(https://[a-zA-Z0-9\-]+\.firebaseio\.com)'
    confidence: high
    service: Firebase

  firebase_server_key:
    pattern: '(AAAA[A-Za-z0-9_\-]{7}:[A-Za-z0-9_\-]{140})'
    confidence: high
    service: Firebase Cloud Messaging

  firebase_api_key:
    pattern: '"apiKey"\s*:\s*"(AIza[0-9A-Za-z\-_]{35})"'
    confidence: high
    service: Firebase Config

  gcp_access_token:
    pattern: '(ya29\.[0-9A-Za-z_\-]{60,})'
    confidence: high
    service: GCP OAuth Access Token

  # ─── AWS ────────────────────────────────────────────────────────
  aws_access_key:
    pattern: '(AKIA[0-9A-Z]{16})'
    confidence: high
    service: AWS IAM

  aws_secret_key:
    pattern: '(?i)aws.{0,20}secret.{0,20}[''"][0-9A-Za-z/+]{40}[''"]'
    confidence: high
    service: AWS IAM

  aws_session_token:
    pattern: '(AQoD|AQoE|AQoF|AQoG|AQoH)[A-Za-z0-9/+]{100,}'
    confidence: high
    service: AWS STS Session Token

  aws_s3_url:
    pattern: '(https?://s3\.amazonaws\.com/[a-z0-9\-\.]+/[^\s"'']+)'
    confidence: medium
    service: AWS S3

  aws_cognito_id:
    pattern: '(us|eu|ap)\-[a-z]+\-[0-9]:[0-9a-f]{8}\-[0-9a-f]{4}\-[0-9a-f]{4}\-[0-9a-f]{4}\-[0-9a-f]{12}'
    confidence: high
    service: AWS Cognito Identity Pool

  aws_lambda_arn:
    pattern: 'arn:aws:lambda:[a-z]{2}-[a-z]+-[0-9]:[0-9]{12}:function:[A-Za-z0-9\-_]+'
    confidence: medium
    service: AWS Lambda ARN

  aws_account_id:
    pattern: '(?i)(?:aws_account_id|owner_id|aws_id).{0,5}([0-9]{12})'
    confidence: low
    service: AWS Account ID

  # ─── STRIPE ─────────────────────────────────────────────────────
  stripe_live_secret:
    pattern: '(sk_live_[0-9a-zA-Z]{24,})'
    confidence: high
    service: Stripe

  stripe_test_secret:
    pattern: '(sk_test_[0-9a-zA-Z]{24,})'
    confidence: high
    service: Stripe (test)

  stripe_live_publishable:
    pattern: '(pk_live_[0-9a-zA-Z]{24,})'
    confidence: high
    service: Stripe

  stripe_test_publishable:
    pattern: '(pk_test_[0-9a-zA-Z]{24,})'
    confidence: medium
    service: Stripe (test)

  stripe_webhook_secret:
    pattern: '(whsec_[A-Za-z0-9]{40,})'
    confidence: high
    service: Stripe Webhook

  stripe_restricted_key:
    pattern: '(rk_live_[0-9a-zA-Z]{24,})'
    confidence: high
    service: Stripe Restricted Key

  # ─── GITHUB / GITLAB ────────────────────────────────────────────
  github_personal_token:
    pattern: '(ghp_[0-9A-Za-z]{36})'
    confidence: high
    service: GitHub Personal Access Token

  github_oauth_token:
    pattern: '(gho_[0-9A-Za-z]{36})'
    confidence: high
    service: GitHub OAuth

  github_app_token:
    pattern: '(ghs_[0-9A-Za-z]{36})'
    confidence: high
    service: GitHub App

  github_refresh_token:
    pattern: '(ghr_[0-9A-Za-z]{76})'
    confidence: high
    service: GitHub Refresh Token

  github_fine_grained:
    pattern: '(github_pat_[A-Za-z0-9_]{82})'
    confidence: high
    service: GitHub Fine-grained PAT

  gitlab_personal_token:
    pattern: '(glpat-[0-9A-Za-z\-_]{20})'
    confidence: high
    service: GitLab PAT

  gitlab_runner_token:
    pattern: '(GR1348941[0-9a-zA-Z_\-]{20})'
    confidence: high
    service: GitLab Runner

  # ─── SLACK / DISCORD / TEAMS ────────────────────────────────────
  slack_bot_token:
    pattern: '(xoxb-[0-9]{11,13}-[0-9]{11,13}-[0-9A-Za-z]{24})'
    confidence: high
    service: Slack Bot Token

  slack_user_token:
    pattern: '(xoxp-[0-9]{11,13}-[0-9]{11,13}-[0-9]{11,13}-[0-9a-f]{32})'
    confidence: high
    service: Slack User Token

  slack_app_token:
    pattern: '(xapp-[0-9]-[A-Z0-9]{11}-[0-9]+-[0-9a-f]{64})'
    confidence: high
    service: Slack App Token

  slack_webhook_url:
    pattern: '(https://hooks\.slack\.com/services/T[A-Z0-9]{8}/B[A-Z0-9]{8}/[A-Za-z0-9]{24})'
    confidence: high
    service: Slack Incoming Webhook

  slack_legacy_token:
    pattern: '(xox[baprs]-[0-9a-zA-Z\-]+)'
    confidence: medium
    service: Slack Legacy Token

  discord_bot_token:
    pattern: '([MN][A-Za-z\d]{23}\.[\w-]{6}\.[\w-]{27})'
    confidence: high
    service: Discord Bot Token

  discord_webhook:
    pattern: '(https://discord(?:app)?\.com/api/webhooks/[0-9]{17,20}/[A-Za-z0-9\-_]{60,})'
    confidence: high
    service: Discord Webhook

  teams_webhook:
    pattern: '(https://[a-zA-Z0-9\-]+\.webhook\.office\.com/webhookb2/[A-Za-z0-9\-@\.]+)'
    confidence: high
    service: Microsoft Teams Webhook

  # ─── TWILIO / SENDGRID / MAILGUN ────────────────────────────────
  twilio_account_sid:
    pattern: '(AC[a-z0-9]{32})'
    confidence: high
    service: Twilio Account SID

  twilio_auth_token:
    pattern: '(SK[0-9a-fA-F]{32})'
    confidence: high
    service: Twilio Auth Token

  twilio_api_key:
    pattern: '(SK[a-z0-9]{32})'
    confidence: high
    service: Twilio API Key

  sendgrid_api_key:
    pattern: '(SG\.[A-Za-z0-9\-_]{22}\.[A-Za-z0-9\-_]{43})'
    confidence: high
    service: SendGrid

  mailgun_api_key:
    pattern: '(key-[0-9a-zA-Z]{32})'
    confidence: high
    service: Mailgun

  mailchimp_api_key:
    pattern: '([0-9a-f]{32}-us[0-9]{1,2})'
    confidence: high
    service: Mailchimp

  # ─── PAYMENT / FINANCE ──────────────────────────────────────────
  paypal_client_secret:
    pattern: '(?i)paypal.{0,30}[''"][A-Za-z0-9_\-]{40,}[''"]'
    confidence: medium
    service: PayPal

  square_access_token:
    pattern: '(EAAAl[A-Za-z0-9_\-]{60,})'
    confidence: high
    service: Square

  square_oauth_secret:
    pattern: '(sq0csp-[A-Za-z0-9_\-]{43})'
    confidence: high
    service: Square OAuth

  braintree_key:
    pattern: '(?i)braintree.{0,30}[''"][A-Za-z0-9]{32,}[''"]'
    confidence: medium
    service: Braintree

  # ─── SOCIAL / AUTH ──────────────────────────────────────────────
  facebook_app_secret:
    pattern: '(?i)facebook.{0,30}[''"][0-9a-f]{32}[''"]'
    confidence: medium
    service: Facebook

  facebook_access_token:
    pattern: '(EAACEdEose0cBA[0-9A-Za-z]+)'
    confidence: high
    service: Facebook Access Token

  twitter_api_key:
    pattern: '(?i)twitter.{0,30}[''"][A-Za-z0-9]{18,25}[''"]'
    confidence: medium
    service: Twitter/X

  twitter_bearer_token:
    pattern: '(AAAAAAAAAAAAAAAAAAAAAA[A-Za-z0-9%]{30,})'
    confidence: high
    service: Twitter/X Bearer Token

  linkedin_client_secret:
    pattern: '(?i)linkedin.{0,30}[''"][A-Za-z0-9]{16}[''"]'
    confidence: medium
    service: LinkedIn

  # ─── CLOUD PROVIDERS ────────────────────────────────────────────
  azure_subscription_key:
    pattern: '(?i)(subscription.key|ocp.apim.subscription.key)\s*[:=]\s*[''"]([A-Za-z0-9]{32})[''"]'
    confidence: high
    service: Azure API Management

  azure_connection_string:
    pattern: 'DefaultEndpointsProtocol=https;AccountName=[^;]+;AccountKey=[A-Za-z0-9+/=]{88};'
    confidence: high
    service: Azure Storage

  azure_sas_token:
    pattern: '(sv=202[0-9]&[a-zA-Z0-9%&=\-_+]+sig=[A-Za-z0-9%+/=]{40,})'
    confidence: high
    service: Azure SAS Token

  azure_tenant_id:
    pattern: '(?i)(tenant.?id|directory.?id)\s*[:=]\s*[''"]([0-9a-f\-]{36})[''"]'
    confidence: medium
    service: Azure Active Directory

  heroku_api_key:
    pattern: '(?i)heroku.{0,20}[''"][0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}[''"]'
    confidence: high
    service: Heroku

  digitalocean_token:
    pattern: '(dop_v1_[a-f0-9]{64})'
    confidence: high
    service: DigitalOcean Personal Access Token

  digitalocean_spaces:
    pattern: '(DO[A-Z0-9]{16})'
    confidence: medium
    service: DigitalOcean Spaces

  cloudflare_api_key:
    pattern: '(?i)cloudflare.{0,20}[''"][A-Za-z0-9]{37}[''"]'
    confidence: medium
    service: Cloudflare

  cloudflare_global_key:
    pattern: '[A-Za-z0-9]{37}cloudflare'
    confidence: medium
    service: Cloudflare Global API Key

  # ─── DATABASES ──────────────────────────────────────────────────
  mongodb_uri:
    pattern: '(mongodb(\+srv)?://[a-zA-Z0-9_\-]+:[^@\s"'']+@[a-zA-Z0-9\.\-]+[^''">\s]+)'
    confidence: high
    service: MongoDB Connection URI

  postgresql_uri:
    pattern: '(postgres(ql)?://[a-zA-Z0-9_\-]+:[^@\s"'']+@[a-zA-Z0-9\.\-]+[^''">\s]+)'
    confidence: high
    service: PostgreSQL Connection URI

  mysql_uri:
    pattern: '(mysql://[a-zA-Z0-9_\-]+:[^@\s"'']+@[a-zA-Z0-9\.\-]+[^''">\s]+)'
    confidence: high
    service: MySQL Connection URI

  redis_uri:
    pattern: '(redis://[^@\s"'']+@[a-zA-Z0-9\.\-]+[^''">\s]+)'
    confidence: high
    service: Redis Connection URI

  jdbc_connection:
    pattern: '(jdbc:(mysql|postgresql|oracle|sqlserver)://[^\s"'']+)'
    confidence: high
    service: JDBC Connection String

  database_password:
    pattern: '(?i)(DB_PASS|DATABASE_PASSWORD|DB_PASSWORD|MYSQL_PASSWORD|POSTGRES_PASSWORD)\s*[:=]\s*[''"]([^''"]{6,})[''"]'
    confidence: high
    service: Database Credentials

  # ─── AUTH / TOKENS ──────────────────────────────────────────────
  jwt_token:
    pattern: '(eyJ[a-zA-Z0-9_\-]+\.[a-zA-Z0-9_\-]+\.[a-zA-Z0-9_\-]+)'
    confidence: high
    service: JSON Web Token

  bearer_token:
    pattern: '(?i)Authorization\s*[:=]\s*[''"]?Bearer\s+([A-Za-z0-9\-._~+/]+=*)'
    confidence: high
    service: Bearer Auth Token

  oauth_access_token:
    pattern: '(?i)(access_token|oauth_token)\s*[:=]\s*[''"]([A-Za-z0-9\-._~+/]{20,})[''"]'
    confidence: high
    service: OAuth Token

  refresh_token:
    pattern: '(?i)refresh_token\s*[:=]\s*[''"]([A-Za-z0-9\-._~+/]{20,})[''"]'
    confidence: high
    service: OAuth Refresh Token

  basic_auth_header:
    pattern: '(?i)Authorization\s*[:=]\s*[''"]?Basic\s+([A-Za-z0-9+/=]{20,})'
    confidence: high
    service: HTTP Basic Auth

  # ─── PRIVATE KEYS / CERTIFICATES ────────────────────────────────
  private_key_rsa:
    pattern: '-----BEGIN RSA PRIVATE KEY-----'
    confidence: high
    service: RSA Private Key

  private_key_ec:
    pattern: '-----BEGIN EC PRIVATE KEY-----'
    confidence: high
    service: EC Private Key

  private_key_generic:
    pattern: '-----BEGIN PRIVATE KEY-----'
    confidence: high
    service: PKCS8 Private Key

  private_key_openssh:
    pattern: '-----BEGIN OPENSSH PRIVATE KEY-----'
    confidence: high
    service: OpenSSH Private Key

  certificate_pem:
    pattern: '-----BEGIN CERTIFICATE-----'
    confidence: medium
    service: X.509 Certificate

  pgp_private_key:
    pattern: '-----BEGIN PGP PRIVATE KEY BLOCK-----'
    confidence: high
    service: PGP Private Key

  # ─── ANDROID / MOBILE SPECIFIC ──────────────────────────────────
  android_keystore_password:
    pattern: '(?i)(keystore.?password|store.?pass|key.?pass)\s*[:=]\s*[''"]([^''"]{4,})[''"]'
    confidence: high
    service: Android Keystore

  android_signing_config:
    pattern: '(?i)(storePassword|keyPassword|keyAlias)\s*=\s*[''"]([^''"]+)[''"]'
    confidence: high
    service: Android Signing Config (build.gradle)

  google_play_key:
    pattern: '"type"\s*:\s*"service_account".*"private_key"'
    confidence: high
    service: Google Play Service Account

  admob_app_id:
    pattern: '(ca-app-pub-[0-9]{16}~[0-9]{10})'
    confidence: high
    service: Google AdMob

  android_maps_key:
    pattern: '(AIza[0-9A-Za-z\-_]{35}).*maps'
    confidence: high
    service: Google Maps Android SDK

  # ─── DEVOPS / CI-CD ─────────────────────────────────────────────
  jenkins_api_token:
    pattern: '(?i)jenkins.{0,20}[''"][0-9a-f]{32,}[''"]'
    confidence: medium
    service: Jenkins

  travis_ci_token:
    pattern: '(?i)travis.{0,20}[''"][A-Za-z0-9_\-]{22}[''"]'
    confidence: medium
    service: Travis CI

  circle_ci_token:
    pattern: '(?i)circle.?ci.{0,20}[''"][A-Za-z0-9]{40}[''"]'
    confidence: medium
    service: CircleCI

  sonar_token:
    pattern: '(squ_[A-Za-z0-9]{40})'
    confidence: high
    service: SonarQube/SonarCloud

  npm_token:
    pattern: '(npm_[A-Za-z0-9]{36})'
    confidence: high
    service: NPM Access Token

  docker_hub_token:
    pattern: '(?i)docker.{0,20}[''"][A-Za-z0-9_\-]{64,}[''"]'
    confidence: medium
    service: Docker Hub

  # ─── MONITORING / ANALYTICS ─────────────────────────────────────
  datadog_api_key:
    pattern: '(?i)datadog.{0,20}[''"][A-Za-z0-9]{32}[''"]'
    confidence: medium
    service: Datadog

  datadog_app_key:
    pattern: '(?i)(dd.app.key|datadog.app.key).{0,20}[''"][A-Za-z0-9]{40}[''"]'
    confidence: high
    service: Datadog App Key

  newrelic_license_key:
    pattern: '([A-Za-z0-9]{40}NRAL)'
    confidence: high
    service: New Relic License Key

  sentry_dsn:
    pattern: '(https://[A-Za-z0-9]{32}@o[0-9]+\.ingest\.sentry\.io/[0-9]+)'
    confidence: high
    service: Sentry DSN

  amplitude_api_key:
    pattern: '(?i)amplitude.{0,20}[''"][A-Za-z0-9]{32}[''"]'
    confidence: medium
    service: Amplitude

  mixpanel_token:
    pattern: '(?i)mixpanel.{0,20}[''"][A-Za-z0-9]{32}[''"]'
    confidence: medium
    service: Mixpanel

  # ─── AI / ML SERVICES ───────────────────────────────────────────
  openai_api_key:
    pattern: '(sk-[A-Za-z0-9]{48})'
    confidence: high
    service: OpenAI

  openai_org_id:
    pattern: '(org-[A-Za-z0-9]{24})'
    confidence: high
    service: OpenAI Organization

  anthropic_api_key:
    pattern: '(sk-ant-[A-Za-z0-9\-_]{95,})'
    confidence: high
    service: Anthropic Claude

  huggingface_token:
    pattern: '(hf_[A-Za-z0-9]{37})'
    confidence: high
    service: HuggingFace Access Token

  replicate_token:
    pattern: '(r8_[A-Za-z0-9]{40})'
    confidence: high
    service: Replicate

  # ─── GENERIC HIGH-ENTROPY SECRETS ───────────────────────────────
  password_assignment:
    pattern: '(?i)(password|passwd|pwd)\s*[:=]\s*[''"]([^''"\\+\s]{8,})[''"]'
    confidence: medium
    service: Generic Password

  secret_assignment:
    pattern: '(?i)(secret|token|api[_\-]?key|auth[_\-]?key)\s*[:=]\s*[''"]([A-Za-z0-9_\-\.=+/]{12,})[''"]'
    confidence: medium
    service: Generic Secret

  private_endpoint:
    pattern: '(https?://(api|backend|internal|admin|dev|staging|prod)\.[a-zA-Z0-9\-\.]+\.[a-z]{2,}/[^\s"'']*)'
    confidence: medium
    service: Private API Endpoint

  ip_with_creds:
    pattern: '(https?://[a-zA-Z0-9_\-]+:[^@\s"'']{4,}@[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})'
    confidence: high
    service: IP with Embedded Credentials

  base64_secret:
    pattern: '(?i)(secret|key|token|pass).{0,10}[''"]([A-Za-z0-9+/]{40,}={0,2})[''"]'
    confidence: medium
    service: Base64-encoded Secret

